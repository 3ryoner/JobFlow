[project]
name = "jobflow"
version = "0.1.0"
description = "Asynchronous Recruitment & Workflow Engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "ASYNC",
]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["jobflow"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
